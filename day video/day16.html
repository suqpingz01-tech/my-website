<!-- เลื่อน จุด หยุดวิดีโอ -->
<script>
let current = 0;
let player;

function getSlides() {
    return document.querySelectorAll('.slide');
}
function getDots() {
    return document.querySelectorAll('.dot');
}

function showSlide(index){
    const slides = getSlides();
    const dots = getDots();

    if(!slides.length) return;

    // วนกลับไปต้น/ท้ายถ้าเกินขอบ
    current = (index + slides.length) % slides.length;

    if(player && typeof player.pauseVideo === 'function'){
        player.pauseVideo();
    }

    slides.forEach(slide => slide.classList.remove('active'));
    dots.forEach(dot => dot.classList.remove('active-dot'));

    slides[current].classList.add('active');
    if(dots[current]) dots[current].classList.add('active-dot');
}

// ใช้ event delegation ที่ document แทนการ bind ตรงๆ ที่ปุ่ม
// -> ทำงานได้แม้ปุ่มจะถูกแทรกเข้ามาทีหลัง (AJAX/SPA) ไม่ต้องรอ F5
document.addEventListener('click', function(e){
    if(e.target && e.target.id === 'next'){
        showSlide(current + 1);
    }
    if(e.target && e.target.id === 'prev'){
        showSlide(current - 1);
    }
});

// สร้าง YouTube player อัตโนมัติเมื่อ element #ytplayer โผล่ขึ้นมาในหน้า
// (รองรับทั้งกรณีโหลดตอนแรก และกรณีแทรกเข้ามาทีหลัง)
let ytApiReady = false;

function onYouTubeIframeAPIReady() {
    ytApiReady = true;
    tryInitPlayer();
}

function tryInitPlayer() {
    const el = document.getElementById('ytplayer');
    if(ytApiReady && el && !player){
        player = new YT.Player('ytplayer');
    }
}

// เฝ้าดู DOM เผื่อ #ytplayer ถูกแทรกเข้ามาทีหลัง
const observer = new MutationObserver(() => {
    tryInitPlayer();
});
observer.observe(document.body, { childList: true, subtree: true });

// เผื่อกรณีหน้าโหลดตอนแรกและ element มีอยู่แล้ว
tryInitPlayer();
</script>
